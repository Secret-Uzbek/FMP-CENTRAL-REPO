name: Deploy Terra Codex Worker

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Cloudflare Wrangler environment"
        required: true
        default: "production"
      deploy_reason:
        description: "Why this deploy is being run"
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Verify worker surfaces
        shell: bash
        run: |
          set -euo pipefail
          test -f worker.js
          test -f wrangler.toml

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --env "${{ github.event.inputs.target_env }}"
