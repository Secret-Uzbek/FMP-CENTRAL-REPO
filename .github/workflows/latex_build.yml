name: Build LaTeX -> PDF

on:
  push:
    paths:
      - '**.tex'
      - '**.bib'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Find LaTeX files
        id: find-tex
        run: |
          # Find all .tex files in repository
          TEX_FILES=$(find . -name "*.tex" -type f | head -5)
          echo "Found LaTeX files:"
          echo "$TEX_FILES"
          
          # If no .tex files, skip
          if [ -z "$TEX_FILES" ]; then
            echo "No LaTeX files found"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            # Get first .tex file
            FIRST_TEX=$(echo "$TEX_FILES" | head -1)
            echo "main_tex=$FIRST_TEX" >> $GITHUB_OUTPUT
          fi
      
      - name: Compile LaTeX
        if: steps.find-tex.outputs.skip != 'true'
        uses: xu-cheng/latex-action@v2
        with:
          root_file: ${{ steps.find-tex.outputs.main_tex }}
          working_directory: .
          latexmk_use_xelatex: true
          args: -pdf -interaction=nonstopmode -file-line-error
      
      - name: Upload PDFs
        if: steps.find-tex.outputs.skip != 'true'
        uses: actions/upload-artifact@v3
        with:
          name: compiled-pdfs
          path: |
            **/*.pdf
          retention-days: 30
      
      - name: Comment with PDF links
        if: steps.find-tex.outputs.skip != 'true' && github.event_name == 'push'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '✅ LaTeX compilation successful! PDFs available in Actions artifacts.'
            })
