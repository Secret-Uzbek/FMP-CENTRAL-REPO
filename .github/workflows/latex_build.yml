name: Build LaTeX -> PDF

permissions:
  contents: read
  security-events: write
on:
  workflow_dispatch:  # Only manual trigger (no .tex files in repo)

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Info
        run: |
          echo "⚠️ No LaTeX files found in repository"
          echo "This workflow is disabled until .tex files are added"
