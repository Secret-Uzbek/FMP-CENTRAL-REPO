// FMP Browser Console Publisher
// Paste this in browser console (F12) when on any webpage
// It will prompt for tokens and publish to Zenodo

(async function() {
  console.log('%c🚀 FMP Auto-Publisher', 'color: #4CAF50; font-size: 20px; font-weight: bold');
  
  // Get Zenodo token
  const zenodoToken = prompt('Enter Zenodo API token:');
  if (!zenodoToken) {
    console.error('❌ No token provided');
    return;
  }
  
  // Get files (just README for now)
  const files = [
    {
      name: 'README.md',
      content: '# FMP Supplementary Materials\n\nTest publication from browser console.'
    }
  ];
  
  try {
    console.log('📦 Creating Zenodo deposition...');
    
    // Step 1: Create deposition
    const createResp = await fetch('https://zenodo.org/api/deposit/depositions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${zenodoToken}`,
        'Content-Type': 'application/json'
      }
    });
    
    if (!createResp.ok) {
      throw new Error(`HTTP ${createResp.status}: ${await createResp.text()}`);
    }
    
    const deposition = await createResp.json();
    const depositionId = deposition.id;
    const bucketUrl = deposition.links.bucket;
    
    console.log(`✅ Deposition created: ${depositionId}`);
    console.log(`🔗 Review at: https://zenodo.org/deposit/${depositionId}`);
    
    // Step 2: Upload files
    console.log('📤 Uploading files...');
    
    for (const file of files) {
      console.log(`  Uploading: ${file.name}`);
      
      const blob = new Blob([file.content], { type: 'text/plain' });
      
      const uploadResp = await fetch(`${bucketUrl}/${file.name}`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${zenodoToken}`,
        },
        body: blob
      });
      
      if (!uploadResp.ok) {
        throw new Error(`Upload failed: ${await uploadResp.text()}`);
      }
      
      console.log(`  ✅ ${file.name}`);
    }
    
    // Step 3: Add metadata
    console.log('📝 Adding metadata...');
    
    const metadata = {
      metadata: {
        title: 'FMP Supplementary Materials - Browser Test',
        upload_type: 'dataset',
        description: 'Test publication from browser console. Fractal Metascience Paradigm supplementary materials.',
        creators: [{
          name: 'Abdukarimov, Abdurashid Abdulkhamitovich',
          affiliation: 'Independent Researcher, Tashkent, Uzbekistan',
          orcid: '0009-0000-6394-4912'
        }],
        keywords: ['fractal metascience', 'FMP', 'test'],
        license: 'cc-by-4.0',
        version: 'v1.1-test',
        publication_date: new Date().toISOString().split('T')[0]
      }
    };
    
    const metaResp = await fetch(`https://zenodo.org/api/deposit/depositions/${depositionId}`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${zenodoToken}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(metadata)
    });
    
    if (!metaResp.ok) {
      throw new Error(`Metadata failed: ${await metaResp.text()}`);
    }
    
    console.log('✅ Metadata added');
    
    // Step 4: Don't auto-publish (leave as draft)
    console.log('');
    console.log('%c✅ SUCCESS!', 'color: #4CAF50; font-size: 16px; font-weight: bold');
    console.log('');
    console.log(`📋 Deposition ID: ${depositionId}`);
    console.log(`🔗 Review at: https://zenodo.org/deposit/${depositionId}`);
    console.log('');
    console.log('To publish: Go to the URL above and click "Publish"');
    
    // Open in new tab
    window.open(`https://zenodo.org/deposit/${depositionId}`, '_blank');
    
  } catch (error) {
    console.error('❌ Error:', error.message);
    console.error(error);
  }
})();
