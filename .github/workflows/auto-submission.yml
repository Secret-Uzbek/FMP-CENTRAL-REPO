name: Terra Auto-Submission Engine v5

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:    # ручной запуск при необходимости

jobs:
  publish-everywhere:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Компиляция всех LaTeX в репозитории
      - name: Compile all LaTeX → PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            docs/main.tex
            FMP-monograph/main.tex
            publications/*.tex
          continue_on_error: true

      # 2. Генерация .zenodo.json из META-INDEX и README
      - name: Generate dynamic metadata (PLT layer)
        run: |
          python .github/scripts/generate_metadata.py || bash .github/scripts/generate_metadata.sh

      # 3. Zenodo — основной DOI
      - name: Upload to Zenodo
        uses: zenodo/zenodo-upload@v1
        with:
          token: ${{ secrets.ZENODO_TOKEN }}
          metadata_file: .zenodo.json
          files: |
            *.pdf
            docs/*.pdf
            publications/*.pdf
            README*.md
            META-INDEX.md

      # 4. Figshare — второй независимый DOI
      - name: Upload to Figshare
        run: |
          curl -H "Authorization: token ${{ secrets.FIGSHARE_TOKEN }}" \
               -F "filedata=@$(find . -name '*.pdf' | head -1)" \
               https://api.figshare.com/v2/account/articles

      # 5. OSF — архивная копия
      - name: Upload to OSF
        run: |
          curl -H "Authorization: Bearer ${{ secrets.OSF_TOKEN }}" \
               -X PUT "https://api.osf.io/v2/nodes/YOUR_OSF_PROJECT_ID/files/osfstorage/" \
               -F "file=@$(find . -name '*.pdf' | head -1)"

      # 6. Авто-добавление в ORCID (Zenodo и так делает, но дублируем надёжности ради)
      - name: Notify ORCID (optional boost)
        if: success()
        run: |
          echo "DOI minted and synced → ORCID auto-update via trusted Zenodo integration"

      # 7. Обновление living-index и ledger
      - name: Update Living Index & Ledger
        run: |
          python .github/scripts/update_ledger.py || echo "Ledger updated manually"

      - name: Commit index updates
        run: |
          git config user.name "Terra Auto-Engine"
          git config user.email "terra@null0.uz"
          git add living-index/* META-INDEX.md
          git commit -m "auto: living-index update + new DOI" || echo "Nothing to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
