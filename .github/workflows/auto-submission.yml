# .github/workflows/auto-submission.yml
# Terra Auto-Submission Engine v7.0 — полностью рабочий 17.11.2025
# Author: Abdurashid Abdulkhamitovich Abdukarimov (ORCID: 0009-0000-6394-4912)

name: Terra Auto-Submission

on:
  schedule:
    - cron: '0 9 * * 1'                  # каждый понедельник 09:00 UTC (14:00 Ташкент)
  workflow_dispatch:
    inputs:
      target_journal:
        description: 'Целевой журнал / направление'
        required: true
        default: all
        type: choice
        options: [philosophy, nbiot, education, ai-education, epistemology, all]
      platforms:
        description: 'Платформы (через запятую)'
        required: true
        default: zenodo,figshare,osf

jobs:
  terra-auto-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Central Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: central-repo

      - name: Clone All FMP Repositories
        run: |
          mkdir -p repos
          repos=(
            AIUZ-Terra-codex
            FMP-monograph
            AIUZ-terra-codex-FMP
            Theory-of-fractal-metascience-paradigm
            Nullo-PLT-UCOMM-FMP-Academic-Research
            AIUZ-Terra-Ecosystem
            Uzbek-mining
          )
          for repo in "${repos[@]}"; do
            echo "Cloning Secret-Uzbek/$repo ..."
            git clone https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/Secret-Uzbek/${repo}.git repos/${repo} || echo "skip $repo"
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests PyYAML jinja2 markdown2

      - name: Generate Article (Terra FMP Engine)
        id: generate
        env:
          TARGET: ${{ github.event.inputs.target_journal || 'all' }}
        run: |
          python3 .github/scripts/generate_article.py
          echo "article_title=$(cat output/title.txt)" >> $GITHUB_OUTPUT

      # ========== ZENODO ==========
      - name: Publish to Zenodo (real, not sandbox)
        if: contains(github.event.inputs.platforms || 'zenodo', 'zenodo')
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          python3 .github/scripts/publish_zenodo.py

      # ========== FIGSHARE ==========
      - name: Publish to Figshare
        if: contains(github.event.inputs.platforms || 'figshare', 'figshare')
        env:
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}
        run: |
          python3 .github/scripts/publish_figshare.py

      # ========== OSF ==========
      - name: Publish to OSF
        if: contains(github.event.inputs.platforms || 'osf', 'osf')
        env:
          OSF_TOKEN: ${{ secrets.OSF_TOKEN }}
        run: |
          python3 .github/scripts/publish_osf.py

      # ========== GitHub Release ==========
      - name: Create GitHub Release + DOI badges
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-v${{ github.run_number }}
          name: "Terra Auto-Submission #${{ github.run_number }} — ${{ steps.generate.outputs.article_title }}"
          body: |
            Fractal Metascience Paradigm — автоматическая публикация из 8 репозиториев
            DOI Zenodo: ![](https://zenodo.org/badge/DOI/[будет после публикации].svg)
            Created in prison. Zero budget. Maximum impact.
          files: |
            output/*.pdf
            output/*.json
            output/*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Update README with new badges
        run: |
          python3 .github/scripts/update_readme_badges.py
          git config user.name "Terra Bot"
          git config user.email "a.a.abdukarimov@tutamail.com"
          git add README.md
          git commit -m "auto: add new DOI badges from run #${{ github.run_number }}" || echo "nothing to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
