name: Terra Auto-Submission
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target journal'
        default: 'all'

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: central-repo

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create output
        run: mkdir -p output

      - name: Generate
        run: python .github/scripts/generate_article.py
        env:
          TARGET: ${{ github.event.inputs.target || 'all' }}

      - name: Zenodo
        run: python .github/scripts/publish_zenodo.py
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}

      - name: Figshare
        run: python .github/scripts/publish_figshare.py
        env:
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}

      - name: OSF
        run: python .github/scripts/publish_osf.py
        env:
          OSF_TOKEN: ${{ secrets.OSF_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: submission-${{ github.run_number }}
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
