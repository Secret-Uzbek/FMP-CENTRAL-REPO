name: 🚀 FMP Auto-Publisher v1.1-supplement

on:
  workflow_dispatch:    # можно запустить вручную одной кнопкой
  push:
    tags:
      - 'v*'             # или просто запушить тег и всё само

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run FMP Auto-Publisher (fully automatic)
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}
          OSF_TOKEN: ${{ secrets.OSF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd .publisher
          cat << 'EOF' | node publish.js
          y
          ../fmp_supplementary.md,../package_json.json,../publisher_readme.md,../quick_install.sh,../README - FMP Auto-Publisher Setup.pdf,../FMP Supplementary Materials - Zenodo Package.pdf
          y
          y
          y
          y
          y
          y
          y
          y
          EOF

      - name: Create Release if tagged
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FMP Supplementary Materials ${{ github.ref_name }}
          generate_release_notes: true
