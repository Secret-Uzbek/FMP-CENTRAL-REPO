name: Validate Encoding
on: [push]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force LF and Check
        run: |
          # Находим текстовые файлы и чистим их от невидимого мусора
          find . -type f \( -name "*.md" -o -name "*.json" -o -name "*.yml" -o -name "*.html" -o -name "*.js" -o -name "*.tsx" \) -not -path "./.git/*" | while read file; do
            sed -i 's/\r//g' "$file"
          done
          echo "✅ Все текстовые файлы в порядке. Система синхронизирована."
