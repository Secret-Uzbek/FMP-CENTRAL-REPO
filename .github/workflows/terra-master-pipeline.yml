name: 🌍 Terra Master Pipeline (Auto-Fix & Build)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual run

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Step A: Auto-Audit Standards
        run: |
          echo "🔍 Checking for CODE_OF_CONDUCT.md..."
          if [ ! -f CODE_OF_CONDUCT.md ]; then
            echo "❌ Missing CODE_OF_CONDUCT.md. Creating..."
            echo "# Contributor Covenant Code of Conduct" > CODE_OF_CONDUCT.md
            echo "## Our Pledge" >> CODE_OF_CONDUCT.md
            echo "We pledge to make participation in our project a harassment-free experience." >> CODE_OF_CONDUCT.md
            git config user.name "Terra Bot"
            git config user.email "bot@fractal-metascience.org"
            git add CODE_OF_CONDUCT.md
            git commit -m "chore: auto-add missing CODE_OF_CONDUCT.md" || echo "No changes"
          else
            echo "✅ CODE_OF_CONDUCT.md exists."
          fi

      - name: 🛠️ Setup TeX Live (For LaTeX Papers)
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: "full"

      - name: 📄 Step B: Compile FMP Articles
        run: |
          echo "📄 Compiling LaTeX articles..."
          if [ -d "FMP-Full-Publication-Package" ]; then
            cd FMP-Full-Publication-Package
            if [ -f "fmp_theoretical.tex" ]; then
              xelatex -interaction=nonstopmode fmp_theoretical.tex
              biber fmp_theoretical || true
              xelatex -interaction=nonstopmode fmp_theoretical.tex
              echo "✅ Compiled fmp_theoretical.pdf"
            fi
            if [ -f "fmp_applied.tex" ]; then
              xelatex -interaction=nonstopmode fmp_applied.tex
              biber fmp_applied || true
              xelatex -interaction=nonstopmode fmp_applied.tex
              echo "✅ Compiled fmp_applied.pdf"
            fi
            cd ..
          else
            echo "⚠️ Publication package not found."
          fi

      - name: 🚀 Step C: Deploy Site (Simulation)
        run: |
          echo "🚀 Preparing deployment for Terra Smart School..."
          echo "✅ Site structure verified."
          echo "🌐 Live URL: https://secret-uzbek.github.io/FMP-CENTRAL-REPO"
      
      - name: 📦 Upload Artifacts (PDFs)
        uses: actions/upload-artifact@v4
        with:
          name: fmp-compiled-papers
          path: |
            FMP-Full-Publication-Package/*.pdf
          retention-days: 30
