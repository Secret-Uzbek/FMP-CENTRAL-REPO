name: 🌍 Terra Master Pipeline (Safe Auto-Fix & Build)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Step A: Auto-Audit Standards
        run: |
          echo "🔍 Checking for CODE_OF_CONDUCT.md..."
          if [ ! -f CODE_OF_CONDUCT.md ]; then
            echo "❌ Missing CODE_OF_CONDUCT.md. Creating..."
            echo "# Contributor Covenant Code of Conduct" > CODE_OF_CONDUCT.md
            echo "## Our Pledge" >> CODE_OF_CONDUCT.md
            echo "We pledge to make participation in our project a harassment-free experience." >> CODE_OF_CONDUCT.md
            git config user.name "Terra Bot"
            git config user.email "bot@fractal-metascience.org"
            git add CODE_OF_CONDUCT.md
            git commit -m "chore: auto-add missing CODE_OF_CONDUCT.md" || echo "No changes to commit"
            git push || echo "No push needed"
          else
            echo "✅ CODE_OF_CONDUCT.md exists."
          fi

      - name: 🛠️ Setup TeX Live (For LaTeX Papers)
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: "full"

      - name: 📄 Step B: Compile FMP Articles (Safe Mode)
        run: |
          echo "📄 Attempting to compile LaTeX articles..."
          
          # Проверяем, существует ли папка с публикациями
          if [ -d "FMP-Full-Publication-Package" ]; then
            cd FMP-Full-Publication-Package
            
            # Пробуем скомпилировать теоретическую часть, если файл есть
            if [ -f "fmp_theoretical.tex" ]; then
              echo "✅ Found fmp_theoretical.tex. Compiling..."
              xelatex -interaction=nonstopmode fmp_theoretical.tex || echo "⚠️ First pass warning (normal)"
              biber fmp_theoretical || echo "⚠️ Biber warning (maybe no bib yet)"
              xelatex -interaction=nonstopmode fmp_theoretical.tex || echo "⚠️ Second pass warning"
              xelatex -interaction=nonstopmode fmp_theoretical.tex || echo "⚠️ Final pass warning"
              ls -la *.pdf
            else
              echo "⚠️ fmp_theoretical.tex not found. Skipping theoretical compilation."
            fi

            # Пробуем скомпилировать прикладную часть
            if [ -f "fmp_applied.tex" ]; then
              echo "✅ Found fmp_applied.tex. Compiling..."
              xelatex -interaction=nonstopmode fmp_applied.tex || echo "⚠️ First pass warning"
              biber fmp_applied || echo "⚠️ Biber warning"
              xelatex -interaction=nonstopmode fmp_applied.tex
              xelatex -interaction=nonstopmode fmp_applied.tex
              ls -la *.pdf
            else
              echo "⚠️ fmp_applied.tex not found. Skipping applied compilation."
            fi
            
            cd ..
          else
            echo "⚠️ Directory FMP-Full-Publication-Package not found. Skipping compilation entirely."
          fi
          
          echo "✅ Compilation step finished (successfully or skipped safely)."

      - name: 🚀 Step C: Deploy Site Check
        run: |
          echo "🚀 Verifying site structure..."
          if [ -f "index.html" ]; then
            echo "✅ index.html found. Site is ready."
          else
            echo "⚠️ index.html not found in root. Check public folder."
          fi
      
      - name: 📦 Upload Artifacts (PDFs if any)
        uses: actions/upload-artifact@v4
        with:
          name: fmp-compiled-papers
          path: |
            FMP-Full-Publication-Package/*.pdf
          retention-days: 30
          if-no-files-found: ignore # ЭТО КЛЮЧЕВОЙ МОМЕНТ: игнорировать, если PDF нет
