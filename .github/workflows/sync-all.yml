name: Sync All FMP Repos

permissions:
  contents: read
  security-events: write
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Update timestamp
        run: |
          DATE=$(date +'%Y-%m-%d %H:%M UTC+5')
          sed -i "s/Last updated:.*/Last updated: $DATE/" README.md
          
          git config user.name "FMP Bot"
          git config user.email "a.a.abdukarimov@tutamail.com"
          git add README.md
          git commit -m "chore: update timestamp" || echo "No changes"
          git push || echo "Nothing to push"
      
      - name: Summary
        run: |
          echo "вњ… Sync complete" >> $GITHUB_STEP_SUMMARY
