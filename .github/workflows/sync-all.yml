name: Sync All FMP Repos
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: central-repo

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Create output
        run: mkdir -p output

      - name: Clone repos
        run: |
          mkdir -p repos
          repos=( "AIUZ-Terra-codex" "FMP-monograph" "AIUZ-terra-codex-FMP" "Theory-of-fractal-metascience-paradigm" "Nullo-PLT-UCOMM-FMP-Academic-Research" "AIUZ-Terra-Ecosystem" "Uzbek-mining" )
          for repo in "${repos[@]}"; do
            git clone https://x-access-token:$$ {{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/Secret-Uzbek/ $${repo}.git repos/${repo} || echo "skip $repo"
          done

      - name: Generate article
        run: python .github/scripts/generate_article.py
        env:
          TARGET: 'all'

      - name: Publish Zenodo
        run: python .github/scripts/publish_zenodo.py
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}

      - name: Publish Figshare
        run: python .github/scripts/publish_figshare.py
        env:
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}

      - name: Publish OSF
        run: python .github/scripts/publish_osf.py
        env:
          OSF_TOKEN: ${{ secrets.OSF_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: auto-${{ github.run_number }}
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
