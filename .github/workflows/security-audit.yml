name: "FMP: Security Audit"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '30 2 * * 1' # Запуск каждый понедельник в 02:30 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: "Analyze Code Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@9e35307e363a0276221030027ee0979d0cb74444 # v3.28.10
        with:
          languages: javascript, python
          # Настройка для NULLO/UCOMM: сканируем только важные директории
          queries: security-extended,security-and-quality

      - name: "Autobuild"
        uses: github/codeql-action/autobuild@9e35307e363a0276221030027ee0979d0cb74444 # v3.28.10

      - name: "Perform Analysis"
        uses: github/codeql-action/analyze@9e35307e363a0276221030027ee0979d0cb74444 # v3.28.10
        with:
          category: "/language:javascript-python"
