name: 🧬 TERRA LIFEBLOOD PIPELINE
on:
  schedule:
    - cron: '0 */6 * * *' # Обновление каждые 6 часов
  workflow_dispatch:      # Кнопка "Запустить сейчас"

permissions:
  contents: write

jobs:
  synthesize-knowledge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 🧠 Harvest Repositories
        uses: actions/github-script@v7
        id: repos
        with:
          script: |
            // Сканируем все публичные репо Secret-Uzbek
            const repos = await github.rest.repos.listForUser({
              username: 'Secret-Uzbek',
              type: 'public',
              per_page: 100
            });
            return repos.data.filter(r => !r.archived).map(r => ({
              name: r.name,
              url: r.html_url,
              desc: r.description,
              updated: r.updated_at
            }));

      - name: 📚 Harvest Zotero
        run: |
          # Пытаемся забрать данные. Если API закрыт, создаем заглушку, но в формате JSON
          curl -s "https://api.zotero.org/users/475425/items?format=json&limit=50" > zotero.json || echo "[]" > zotero.json

      - name: 🧬 Generate DNA File
        run: |
          # Создаем файл index_data.json, который сайт сможет прочитать БЕЗ блокировок
          echo '{
            "generated_at": "'$(date -u)'",
            "system_status": "ONLINE",
            "repositories": ${{ steps.repos.outputs.result }},
            "library": ' > index_data.json
          
          # Добавляем данные Zotero
          cat zotero.json >> index_data.json
          
          # Закрываем JSON
          echo '}' >> index_data.json

      - name: 🚀 Deploy to Site
        run: |
          git config --global user.name "Terra Bot"
          git config --global user.email "bot@fractal-metascience.org"
          git add index_data.json
          git commit -m "🧬 Lifeblood Update" || echo "No changes"
          git push
