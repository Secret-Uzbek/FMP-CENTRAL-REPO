name: terra-autofix

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - scaffold_missing_files
      create_pr:
        description: "Open a pull request when scaffold mode creates changes"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: terra-autofix-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit_and_fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit repository surface
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          root = Path(".")
          report = []

          required = [
              "README.md",
              "CITATION.cff",
              "CHANGELOG.md",
              "LIVING_INDEX.md",
          ]
          missing = [name for name in required if not (root / name).exists()]

          mojibake_patterns = [
              r"—,
              r"\u00C3.",
              r"\u00D0.",
              r"\u00D1.",
              r"\uFFFD",
          ]
          mojibake_re = re.compile("|".join(mojibake_patterns))

          text_exts = {".md", ".cff", ".yml", ".yaml", ".txt", ".html"}
          hits = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              if ".git" in path.parts:
                  continue
              if path.as_posix() == ".github/workflows/terra-autofix.yml":
                  continue
              if path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  continue
              count = len(mojibake_re.findall(text))
              if count:
                  hits.append((count, path.as_posix()))

          hits.sort(reverse=True)
          top_hits = hits[:20]

          summary = {
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "missing_core_files": missing,
              "mojibake_top_hits": top_hits,
          }

          Path("terra_autofix_audit.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          lines = []
          lines.append("# Terra AutoFix Audit")
          lines.append("")
          lines.append(f"- Repository: `{summary['repository']}`")
          lines.append(f"- Missing core files: `{len(missing)}`")
          if missing:
              for item in missing:
                  lines.append(f"  - `{item}`")
          lines.append(f"- Mojibake hot spots detected: `{len(top_hits)}`")
          if top_hits:
              for count, path in top_hits:
                  lines.append(f"  - `{path}`: `{count}`")
          Path("terra_autofix_audit.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          echo "audit_path=terra_autofix_audit.md" >> "$GITHUB_OUTPUT"
          echo "json_path=terra_autofix_audit.json" >> "$GITHUB_OUTPUT"

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v7
        with:
          name: terra-autofix-audit-${{ github.run_id }}
          path: |
            terra_autofix_audit.md
            terra_autofix_audit.json

      - name: Scaffold missing core files only
        if: ${{ github.event.inputs.mode == 'scaffold_missing_files' }}
        id: scaffold
        shell: bash
        run: |
          set -euo pipefail
          REPO_NAME="$(basename "$GITHUB_REPOSITORY")"
          TODAY="$(date +%Y-%m-%d)"
          CHANGED=false

          if [[ ! -f "CITATION.cff" ]]; then
            cat > CITATION.cff <<EOF
          cff-version: 1.2.0
          message: "If you use this repository, please cite it as below."
          title: "${REPO_NAME}"
          type: software
          authors:
            - family-names: Abdukarimov
              given-names: Abdurashid
              orcid: "https://orcid.org/0009-0000-6394-4912"
          repository-code: "https://github.com/${GITHUB_REPOSITORY}"
          EOF
            CHANGED=true
          fi

          if [[ ! -f "CHANGELOG.md" ]]; then
            cat > CHANGELOG.md <<EOF
          # Changelog

          ## Unreleased
          - Repository baseline under review.
          EOF
            CHANGED=true
          fi

          if [[ ! -f "LIVING_INDEX.md" ]]; then
            cat > LIVING_INDEX.md <<EOF
          # Living Index

          Generated by Terra AutoFix on ${TODAY}.

          ## Core files
          - README.md
          - CITATION.cff
          - CHANGELOG.md
          - LIVING_INDEX.md
          EOF
            CHANGED=true
          fi

          if [[ "$CHANGED" == "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request for scaffolding changes
        if: ${{ github.event.inputs.mode == 'scaffold_missing_files' && steps.scaffold.outputs.changed == 'true' && github.event.inputs.create_pr == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: scaffold missing Terra core files"
          branch: terra-autofix/${{ github.run_id }}
          title: "Terra AutoFix: scaffold missing core files"
          body: |
            This pull request was created by the manual `terra-autofix` workflow.

            Scope:
            - add missing `CITATION.cff`
            - add missing `CHANGELOG.md`
            - add missing `LIVING_INDEX.md`

            Intentionally excluded:
            - no blind mojibake rewriting
            - no mass header injection
            - no automatic edits to existing content files
          delete-branch: true

      - name: Write workflow summary
        shell: bash
        run: |
          echo "## Terra AutoFix" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: \`${{ github.event.inputs.mode }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Audit artifact: \`terra-autofix-audit-${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event.inputs.mode }}" == "scaffold_missing_files" ]]; then
            echo "- Scaffold changes created: \`${{ steps.scaffold.outputs.changed }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
