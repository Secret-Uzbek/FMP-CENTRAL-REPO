name: Root Guard
on: [push]
jobs:
  check-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Root Files
        run: |
          ALLOWED=$(jq -r '.allowed_root_files[]' control/root_allowlist.json)
          FOUND=$(find . -maxdepth 1 -type f -not -path '*/.*' | sed 's|./||' | sort)
          
          for file in $FOUND; do
            if [[ ! " ${ALLOWED[@]} " =~ " ${file} " ]]; then
              echo "❌ ОШИБКА: Файл [$file] не зарегистрирован в allowlist!"
              exit 1
            fi
          done
          echo "✅ Все файлы в корне легальны."
