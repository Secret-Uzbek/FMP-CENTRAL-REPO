name: Root Guard
on: [push]
jobs:
  check-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atomic Root Audit
        shell: bash
        run: |
          # Считываем разрешенные файлы, убирая кавычки и запятые
          ALLOWED=$(jq -r '.allowed_root_files[]' control/root_allowlist.json | sort)
          # Находим реальные файлы в корне (игнорируем папки и скрытые файлы на .)
          FOUND=$(find . -maxdepth 1 -type f -not -path '*/.*' | sed 's|./||' | sort)
          
          echo "🔍 Проверка когерентности системы..."
          DIFF=$(comm -23 <(echo "$FOUND") <(echo "$ALLOWED"))
          
          if [ -z "$DIFF" ]; then
            echo "✅ Все узлы синхронизированы."
          else
            echo "❌ ОШИБКА: Обнаружены незарегистрированные файлы:"
            echo "$DIFF"
            exit 1
          fi
