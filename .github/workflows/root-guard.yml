name: Root Guard
on: [push]
jobs:
  check-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnostic Root Check
        run: |
          # 1. Получаем список разрешенных файлов из JSON
          ALLOWED=$(jq -r '.allowed_root_files[]' control/root_allowlist.json | sort)
          
          # 2. Смотрим, что реально лежит в корне (игнорируем папки и скрытые файлы на .)
          FOUND=$(ls -p | grep -v / | grep -v '^\.' | sort)
          
          # 3. Сравниваем списки
          DIFF=$(comm -23 <(echo "$FOUND") <(echo "$ALLOWED"))
          
          if [ -n "$DIFF" ]; then
            echo "❌ ОШИБКА: Найдены незарегистрированные файлы в корне:"
            echo "$DIFF"
            echo "-------------------------------------------------------"
            echo "Архитектор, добавь эти имена в control/root_allowlist.json"
            exit 1
          else
            echo "✅ Все файлы в корне легальны."
          fi
