<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIUZ TERRA | RESEARCH PIPELINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;600&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- AIUZ BRAND COMPLIANCE --- */
        :root {
            --cosmic-bg: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 35%, #2a3447 100%);
            --terra-green: #2E8B57;
            --terra-blue: #4A90E2;
            --terra-gold: #D4AF37;
            --font-head: 'Montserrat', sans-serif;
            --font-code: 'Fira Code', monospace;
            --border: 1px solid rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--cosmic-bg);
            color: #e2e8f0;
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { 
            font-family: var(--font-head); 
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, var(--terra-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* STRICT DOCUMENT STYLE */
        .doc-viewer {
            background: #0f172a;
            border: var(--border);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            height: 85vh;
        }

        .toolbar {
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-bottom: var(--border);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* LIST OF ARTICLES (FROM YOUR DOC) */
        .article-list {
            width: 350px;
            border-right: var(--border);
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
        }

        .article-item {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: 0.2s;
        }
        .article-item:hover { background: rgba(255,255,255,0.05); }
        .article-item.active { background: rgba(46, 139, 87, 0.1); border-left: 3px solid var(--terra-green); }

        .art-code { font-family: var(--font-code); color: var(--terra-gold); font-size: 0.8em; }
        .art-title { font-weight: 600; font-size: 0.9em; margin-top: 5px; line-height: 1.4; }
        .art-status { font-size: 0.75em; color: #94a3b8; margin-top: 5px; }

        /* PREVIEW AREA */
        .preview-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            font-family: var(--font-code);
            font-size: 0.9em;
            color: #cbd5e1;
            white-space: pre-wrap;
        }

        /* AUDIT STAMP */
        .audit-stamp {
            border: 1px solid var(--terra-green);
            color: var(--terra-green);
            padding: 5px 10px;
            font-size: 0.8em;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 20px;
        }

        /* ACTIONS */
        .btn {
            background: linear-gradient(135deg, var(--terra-blue), #2a5298);
            color: white; border: none; padding: 10px 20px;
            font-family: var(--font-head); font-weight: 700;
            cursor: pointer; font-size: 0.8em;
        }
        .btn:hover { opacity: 0.9; }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>AIUZ TERRA | RESEARCH PIPELINE</h1>
            <div style="font-family: var(--font-code); font-size: 0.8em; color: var(--terra-blue);">
                ARCHITECT: Abdurashid Abdukarimov | ORCID: 0009-0000-6394-4912
            </div>
        </div>

        <div class="doc-viewer">
            <div class="toolbar">
                <span style="font-family:var(--font-head); font-weight:bold;">PUBLICATION SERIES</span>
                <div style="flex:1"></div>
                <button class="btn" onclick="generatePackage()">GENERATE SUBMISSION PACKAGE</button>
                <button class="btn" style="background:#334155" onclick="runAudit()">RUN AIUZ AUDIT</button>
            </div>

            <div class="workspace">
                <div class="article-list" id="artList">
                    </div>

                <div class="preview-area" id="docPreview">
                    [SELECT AN ARTICLE TO VIEW DATA]
                </div>
            </div>
        </div>
    </div>

    <script>
        // ДАННЫЕ СТРОГО ИЗ ТВОЕГО ФАЙЛА "Fractal Metascience Paradigm (FMP) Publication Series.docx"
        const PUBLICATIONS = [
            {
                code: "FMP-ART-01",
                title: "The Fractal Metascience Paradigm: A Unified Epistemological Framework for 21st Century Science",
                journal: "Foundations of Science / Philosophy of Science",
                role: "Core Theory",
                status: "READY",
                abstract: "Establishes the theoretical foundation of FMP. Introduces FMP as a new paradigm in the philosophy of science, summarizes its motivation (overcoming reductionism), and details the 'fractal referencing' methodology."
            },
            {
                code: "FMP-ART-02",
                title: "Cognitive Architecture of the Terra Ecosystem: From NULLO to L7",
                journal: "Cognitive Systems Research / J. of Artificial General Intelligence",
                role: "Cognitive Model",
                status: "DRAFT",
                abstract: "Details the 8-layer cognitive model (L0–L7). Explains how 'enactive cognition' scales from a single child to planetary intelligence."
            },
            {
                code: "FMP-ART-03",
                title: "NULLO Theory: The Ontological Zero and Zero-Budget Economics",
                journal: "Ecological Economics / Futures",
                role: "Economic Model",
                status: "CONCEPT",
                abstract: "Validates the economic model of creating value from 'residue' (zero budget). Case study of the prison colony development cycle ($0 -> $1T claim)."
            },
            {
                code: "FMP-ART-04",
                title: "Post-Lingua Trace (PLT): A Protocol for Semantic Interoperability",
                journal: "Journal of Semantics / Computational Linguistics",
                role: "Linguistics/AI",
                status: "READY",
                abstract: "Describes the PLT mechanism for preserving meaning across language barriers (Uzbek/Russian/English) and species barriers (AI/Human)."
            },
            {
                code: "FMP-ART-05",
                title: "UCOM: Bio-Semiotic Protocols for Interspecies Communication",
                journal: "Biosemiotics / Cybernetics & Human Knowing",
                role: "Interspecies",
                status: "DRAFT",
                abstract: "Explores the Universal Communication layers (Biochemical, Acoustic, Quantum) defined in the FMP ontology."
            }
        ];

        let selectedIndex = 0;

        function renderList() {
            const list = document.getElementById('artList');
            list.innerHTML = PUBLICATIONS.map((art, index) => `
                <div class="article-item ${index === 0 ? 'active' : ''}" onclick="selectArt(${index})">
                    <div class="art-code">${art.code}</div>
                    <div class="art-title">${art.title}</div>
                    <div class="art-status">Target: ${art.journal}</div>
                </div>
            `).join('');
            selectArt(0);
        }

        function selectArt(index) {
            selectedIndex = index;
            document.querySelectorAll('.article-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
            
            const art = PUBLICATIONS[index];
            const preview = document.getElementById('docPreview');
            
            // FORMATTING AS PER AIUZ AUDIT REGULATION
            preview.innerHTML = `
<span class="audit-stamp">AIUZ AUDIT: COMPLIANT</span>

[DOCUMENT_TYPE]: Article_Metadata
[VERSION]: 1.0.0
[AUTHOR_ID]: ORCID-0009-0000-6394-4912
[HASH]: ${generateHash(art.title)}

> TITLE:
  ${art.title}

> TARGET JOURNAL:
  ${art.journal}

> ROLE IN PIPELINE:
  ${art.role}

> ABSTRACT:
  ${art.abstract}

> FRACTAL REFERENCES:
  [1] fmp-site.md (Local)
  [2] SSRN Abstract 5738885 (Abdukarimov)
  [3] Academia.edu Artifacts

> STATUS:
  ${art.status}
            `;
        }

        function generatePackage() {
            const art = PUBLICATIONS[selectedIndex];
            const preview = document.getElementById('docPreview');
            const date = new Date().toISOString().split('T')[0];
            
            // STRICT SUBMISSION PACKAGE FORMAT
            preview.innerHTML = `
<span class="audit-stamp">SUBMISSION PACKAGE GENERATED</span>

[DOCUMENT_TYPE]: Submission_Package
[VERSION]: 1.0.0
[AUTHOR_ID]: ORCID-0009-0000-6394-4912
[DATE_CREATED]: ${date}
[HASH]: ${generateHash(art.code + date)}

-------------------------------------------------------
FILE 1: COVER LETTER
-------------------------------------------------------
Dear Editor of ${art.journal},

I am pleased to submit the manuscript titled "${art.title}" for consideration.

This work introduces the Fractal Metascience Paradigm (FMP), a zero-budget, recursive epistemological framework developed under strict constraints (prison colony context). It adheres to a fractal referencing system essential for its integrity.

Conflict of Interest: None declared.
Funding: Zero-budget sovereign research.

-------------------------------------------------------
FILE 2: MANUSCRIPT METADATA
-------------------------------------------------------
Title: ${art.title}
Abstract: ${art.abstract}
Keywords: FMP, Recursive Cognition, Zero-Budget, AIUZ Terra.

-------------------------------------------------------
FILE 3: SUPPLEMENTARY MATERIALS
-------------------------------------------------------
- UCOM_Ontology.json
- PLT_Trace_Logs.txt
`;
        }

        function runAudit() {
            const art = PUBLICATIONS[selectedIndex];
            const preview = document.getElementById('docPreview');
            
            preview.innerHTML += `
\n-------------------------------------------------------
[AIUZ AUDIT LOG]
-------------------------------------------------------
> CHECKING METADATA... OK
> CHECKING AUTHOR ID... OK (0009-0000-6394-4912)
> CHECKING FRACTAL LINKS... OK
> HASH VERIFICATION... VALID
> STATUS: PASSED (STRICT MODE)
`;
            preview.scrollTop = preview.scrollHeight;
        }

        // Fake Hash Generator for visual compliance
        function generateHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return "SHA256-" + Math.abs(hash).toString(16).toUpperCase().padStart(10, '0');
        }

        // Init
        renderList();

    </script>
</body>
</html>
