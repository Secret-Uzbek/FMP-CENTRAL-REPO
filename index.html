<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 TERRA CIVILIZATION • Fractal Metascience Institute</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a1f2e 0%, #112b3d 100%);
            color: #d4af37;
            font-family: system-ui, sans-serif;
            overflow-x: hidden;
        }
        .logo {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 5.8rem;
            cursor: pointer;
            text-shadow: 0 0 60px #d4af37;
            transition: all 0.6s ease;
            z-index: 100;
        }
        .logo:hover {
            transform: translateX(-50%) scale(1.12);
            filter: brightness(1.4);
        }
        .content {
            max-width: 1100px;
            margin: 220px auto 80px;
            text-align: center;
            padding: 0 20px;
        }
        h1 {
            font-size: 3.4rem;
            margin: 30px 0 20px;
            line-height: 1.1;
        }
        .start {
            font-size: 1.45rem;
            max-width: 720px;
            margin: 0 auto 60px;
            opacity: 0.95;
        }
        nav a {
            color: #d4af37;
            margin: 0 25px;
            font-size: 1.35rem;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="logo" id="liveLogo">🧬 TERRA CODEX</div>

    <div class="content">
        <h1>Fractal Metascience Institute<br>и Фонд Будущих Поколений</h1>
        <p class="start">Нажми на живой логотип — иммерсивное образование начинается сразу с языкового маркера Navoiy-Terra + Babur</p>

        <nav>
            <a href="#navoiy">Navoiy-Terra v1.2 + Babur</a>
            <a href="#auction">Аукцион технологий</a>
            <a href="#fund">Фонд 90/10</a>
            <a href="#archive">Полный архив (384 файла)</a>
        </nav>
    </div>

    <script>
        document.getElementById('liveLogo').addEventListener('click', () => {
            const lang = (navigator.language || 'ru').toLowerCase();
            if (lang.startsWith('ru') || lang.startsWith('uz')) {
                window.location.hash = 'navoiy';
            } else if (confirm('Ты проявил внимание. Войти в Terra?')) {
                window.location.hash = 'navoiy';
            }
        });
    </script>
</body>
</html>
