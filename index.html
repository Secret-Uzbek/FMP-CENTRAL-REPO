<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TERRA Living Organism Portal - Трёхмерный семантико-онтологический цивилизационный портал. Полностью доступен для всех.">
    <meta name="keywords" content="TERRA, FMP, Fractal Metascience, Accessibility, Inclusive Design">
    <meta name="author" content="Abdurashid Abdukarimov">
    
    <title>∅ TERRA Living Organism Portal v7.1 - Accessible</title>
    
    <!-- React & Babel from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* ========== ACCESSIBILITY FOUNDATION ========== */
        :root {
            --font-size-base: 16px;
            --animation-speed: 1;
        }
        
        /* High Contrast Mode */
        body.high-contrast {
            --bg-primary: #000000;
            --bg-secondary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #ffff00;
            --border-color: #ffffff;
            --focus-color: #ffff00;
        }
        
        body.high-contrast * {
            background-color: var(--bg-primary) !important;
            color: var(--text-primary) !important;
            border-color: var(--border-color) !important;
        }
        
        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        body.reduced-motion * {
            animation: none !important;
            transition: none !important;
        }
        
        /* Font Scaling */
        html {
            font-size: var(--font-size-base);
        }
        
        /* Focus Indicators - WCAG 2.4.7 */
        *:focus {
            outline: 3px solid #00CED1;
            outline-offset: 2px;
        }
        
        body.high-contrast *:focus {
            outline: 3px solid var(--focus-color);
            outline-offset: 3px;
        }
        
        /* Skip to Main Content */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #000;
            color: #fff;
            padding: 8px;
            z-index: 100;
            text-decoration: none;
        }
        
        .skip-link:focus {
            top: 0;
        }
        
        /* Large Touch Targets - WCAG 2.5.5 (44x44px minimum) */
        button,
        a,
        input,
        .clickable {
            min-width: 44px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        /* High Contrast Text - WCAG 1.4.3 (4.5:1 minimum) */
        .text-contrast-high {
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        
        /* Animations with Respecting User Preferences */
        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        /* Screen Reader Only */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
        
        /* Keyboard Navigation Helpers */
        .keyboard-hint {
            font-size: 0.75rem;
            color: #a0aec0;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-indigo-950 to-purple-950 min-h-screen">
    
    <!-- Skip to Main Content Link -->
    <a href="#main-content" class="skip-link">
        Перейти к основному содержимому
    </a>
    
    <!-- React App Root -->
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        /**
         * ═══════════════════════════════════════════════════════════════
         * 🧬 TERRA LIVING ORGANISM PORTAL v7.1 - ACCESSIBLE
         * Полностью доступный трёхмерный семантико-онтологический портал
         * 
         * WCAG 2.1 Level AA Compliance:
         * ✅ 1.4.3 Contrast (Minimum) - 4.5:1
         * ✅ 2.1.1 Keyboard - Full keyboard navigation
         * ✅ 2.4.7 Focus Visible - Clear focus indicators
         * ✅ 2.5.5 Target Size - 44x44px minimum
         * ✅ 4.1.2 Name, Role, Value - ARIA labels
         * 
         * L0 Principle: КАЖДЫЙ ребёнок может пользоваться ✅
         * ═══════════════════════════════════════════════════════════════
         */
        
        const TerraAccessiblePortal = () => {
            // ========== ACCESSIBILITY SETTINGS ==========
            const [highContrast, setHighContrast] = useState(false);
            const [reducedMotion, setReducedMotion] = useState(false);
            const [fontSize, setFontSize] = useState(16);
            const [announcements, setAnnouncements] = useState('');
            
            // ========== QUANTUM STATES ==========
            const [quantumState, setQuantumState] = useState('superposition');
            const [breathingPhase, setBreathingPhase] = useState(0);
            const [activeChromosome, setActiveChromosome] = useState(null);
            const [activeEngine, setActiveEngine] = useState(null);
            const [evolutionPhase, setEvolutionPhase] = useState(0);
            const [dnaRotation, setDnaRotation] = useState(0);
            const [showEngines, setShowEngines] = useState(true);
            const [userInput, setUserInput] = useState('');
            const [processingStage, setProcessingStage] = useState(null);
            
            // ========== ARIA LIVE REGION REF ==========
            const liveRegionRef = useRef(null);
            
            // ========== 7 ХРОМОСОМ qDNA ==========
            const chromosomes = [
                {
                    id: 'A',
                    name: 'Протоколы и Директивы',
                    color: '#00FFB3',
                    symbol: '🧬',
                    docs: 3,
                    activity: 100,
                    description: 'Системная стабильность и этика'
                },
                {
                    id: 'B',
                    name: 'Теоретическая база FMP',
                    color: '#9370DB',
                    symbol: '📚',
                    docs: 10,
                    activity: 99,
                    description: 'Глобальная научно-теоретическая основа'
                },
                {
                    id: 'C',
                    name: 'Методологический аппарат',
                    color: '#32CD32',
                    symbol: '🔬',
                    docs: 3,
                    activity: 100,
                    description: 'Высококачественный мета-анализ'
                },
                {
                    id: 'D',
                    name: 'Практические проекты',
                    color: '#FFB6C1',
                    symbol: '🚀',
                    docs: 5,
                    activity: 96,
                    description: 'Материализация концепций в продукты'
                },
                {
                    id: 'E',
                    name: 'Узбекистанская специализация',
                    color: '#4169E1',
                    symbol: '🇺🇿',
                    docs: 7,
                    activity: 98,
                    description: 'Локальная адаптация и тестирование'
                },
                {
                    id: 'F',
                    name: 'Техническая реализация',
                    color: '#FF6347',
                    symbol: '💻',
                    docs: 2,
                    activity: 100,
                    description: 'Практическое воплощение и этическая чистота'
                },
                {
                    id: 'G',
                    name: 'Эволюционная память',
                    color: '#FFD700',
                    symbol: '📊',
                    docs: 3,
                    activity: 98,
                    description: 'Сохранение и развитие исторической памяти'
                }
            ];
            
            // ========== 5 ФАЗ ЭВОЛЮЦИИ ==========
            const evolutionPhases = [
                { name: 'Квантовое состояние', color: '#00FFB3', symbol: '⚛️' },
                { name: 'Биологическое', color: '#32CD32', symbol: '🧬' },
                { name: 'Детское сознание', color: '#FFB6C1', symbol: '👶' },
                { name: 'Планетарное', color: '#4169E1', symbol: '🌍' },
                { name: 'Космическое', color: '#9370DB', symbol: '🌌' }
            ];
            
            // ========== 3 ДВИЖКА ==========
            const engines = [
                {
                    id: 'ust',
                    name: 'UST Engine',
                    fullName: 'Universal Semantic Translator',
                    symbol: '🌐',
                    color: '#00CED1',
                    description: 'Семантическая обработка любых языков'
                },
                {
                    id: 'fmp',
                    name: 'FMP Engine',
                    fullName: 'Fractal Metascience Paradigm',
                    symbol: '⚛️',
                    color: '#9370DB',
                    description: 'Рекурсивная когерентность'
                },
                {
                    id: 'detox',
                    name: 'Detox Engine',
                    fullName: 'Ethical Safety Validator',
                    symbol: '🛡️',
                    color: '#32CD32',
                    description: 'Приоритет Child Safety'
                }
            ];
            
            // ========== ACCESSIBILITY: ANNOUNCE TO SCREEN READERS ==========
            const announce = (message) => {
                setAnnouncements(message);
                setTimeout(() => setAnnouncements(''), 1000);
            };
            
            // ========== ACCESSIBILITY: APPLY SETTINGS ==========
            useEffect(() => {
                document.body.classList.toggle('high-contrast', highContrast);
                document.body.classList.toggle('reduced-motion', reducedMotion);
                document.documentElement.style.setProperty('--font-size-base', `${fontSize}px`);
            }, [highContrast, reducedMotion, fontSize]);
            
            // ========== BREATHING ANIMATION ==========
            useEffect(() => {
                if (reducedMotion) return;
                const breathInterval = setInterval(() => {
                    setBreathingPhase(prev => (prev + 0.05) % (2 * Math.PI));
                }, 50);
                return () => clearInterval(breathInterval);
            }, [reducedMotion]);
            
            // ========== EVOLUTION PHASES ==========
            useEffect(() => {
                if (reducedMotion) return;
                const evolutionInterval = setInterval(() => {
                    setEvolutionPhase(prev => (prev + 1) % evolutionPhases.length);
                }, 4000);
                return () => clearInterval(evolutionInterval);
            }, [reducedMotion]);
            
            // ========== DNA ROTATION ==========
            useEffect(() => {
                if (reducedMotion) return;
                const rotationInterval = setInterval(() => {
                    setDnaRotation(prev => (prev + 1) % 360);
                }, 50);
                return () => clearInterval(rotationInterval);
            }, [reducedMotion]);
            
            // ========== KEYBOARD NAVIGATION ==========
            useEffect(() => {
                const handleKeyDown = (e) => {
                    // Arrow keys to navigate chromosomes
                    if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        const currentIndex = chromosomes.findIndex(c => c.id === activeChromosome);
                        const nextIndex = (currentIndex + 1) % chromosomes.length;
                        setActiveChromosome(chromosomes[nextIndex].id);
                        announce(`Активирована хромосома ${chromosomes[nextIndex].id}: ${chromosomes[nextIndex].name}`);
                    }
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        const currentIndex = chromosomes.findIndex(c => c.id === activeChromosome);
                        const prevIndex = (currentIndex - 1 + chromosomes.length) % chromosomes.length;
                        setActiveChromosome(chromosomes[prevIndex].id);
                        announce(`Активирована хромосома ${chromosomes[prevIndex].id}: ${chromosomes[prevIndex].name}`);
                    }
                    // Escape to close panels
                    if (e.key === 'Escape') {
                        setActiveChromosome(null);
                        setActiveEngine(null);
                        announce('Панели закрыты');
                    }
                    // H key for high contrast
                    if (e.key === 'h' && e.ctrlKey) {
                        e.preventDefault();
                        setHighContrast(prev => !prev);
                        announce(highContrast ? 'Обычный режим' : 'Режим высокого контраста');
                    }
                };
                
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [activeChromosome, highContrast]);
            
            // ========== PROCESS INPUT ==========
            const processInput = async (input) => {
                if (!input.trim()) return;
                
                announce('Начата обработка через NULLO PLT UCOM FMP EUO');
                
                const stages = ['nullo', 'plt', 'ucom', 'fmp', 'euo'];
                for (let stage of stages) {
                    setProcessingStage(stage);
                    await new Promise(resolve => setTimeout(resolve, 800));
                }
                
                announce('Обработка через движки UST FMP Detox');
                
                for (let engine of engines) {
                    setActiveEngine(engine.id);
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
                
                setProcessingStage(null);
                setActiveEngine(null);
                announce('Обработка завершена');
            };
            
            const currentEvolutionPhase = evolutionPhases[evolutionPhase];
            const breathScale = reducedMotion ? 1 : 1 + Math.sin(breathingPhase) * 0.05;
            
            return (
                <div className="relative w-full min-h-screen overflow-hidden">
                    
                    {/* ========== ARIA LIVE REGION ========== */}
                    <div
                        ref={liveRegionRef}
                        role="status"
                        aria-live="polite"
                        aria-atomic="true"
                        className="sr-only"
                    >
                        {announcements}
                    </div>
                    
                    {/* ========== ACCESSIBILITY CONTROLS (Fixed Top) ========== */}
                    <nav 
                        className="fixed top-0 left-0 right-0 z-50 bg-black/80 backdrop-blur-md border-b border-cyan-500/30 p-3"
                        role="navigation"
                        aria-label="Настройки доступности"
                    >
                        <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-2">
                                <span className="text-cyan-400 font-bold text-sm">♿ Доступность:</span>
                            </div>
                            
                            <div className="flex flex-wrap gap-2">
                                {/* High Contrast */}
                                <button
                                    onClick={() => {
                                        setHighContrast(prev => !prev);
                                        announce(highContrast ? 'Обычный режим' : 'Высокий контраст');
                                    }}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                                        highContrast
                                            ? 'bg-yellow-500 text-black'
                                            : 'bg-gray-800 text-white hover:bg-gray-700'
                                    }`}
                                    aria-pressed={highContrast}
                                    aria-label="Переключить режим высокого контраста"
                                >
                                    🎨 Контраст
                                </button>
                                
                                {/* Reduced Motion */}
                                <button
                                    onClick={() => {
                                        setReducedMotion(prev => !prev);
                                        announce(reducedMotion ? 'Анимация включена' : 'Анимация выключена');
                                    }}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                                        reducedMotion
                                            ? 'bg-purple-500 text-white'
                                            : 'bg-gray-800 text-white hover:bg-gray-700'
                                    }`}
                                    aria-pressed={reducedMotion}
                                    aria-label="Переключить анимацию"
                                >
                                    ⏸️ Без анимации
                                </button>
                                
                                {/* Font Size */}
                                <div className="flex items-center gap-1" role="group" aria-label="Размер шрифта">
                                    <button
                                        onClick={() => {
                                            setFontSize(prev => Math.max(12, prev - 2));
                                            announce(`Размер шрифта уменьшен до ${fontSize - 2}`);
                                        }}
                                        className="px-3 py-2 bg-gray-800 text-white rounded-l-lg hover:bg-gray-700 text-sm font-bold"
                                        aria-label="Уменьшить размер шрифта"
                                    >
                                        A-
                                    </button>
                                    <span className="px-3 py-2 bg-gray-900 text-white text-xs" aria-live="polite">
                                        {fontSize}px
                                    </span>
                                    <button
                                        onClick={() => {
                                            setFontSize(prev => Math.min(24, prev + 2));
                                            announce(`Размер шрифта увеличен до ${fontSize + 2}`);
                                        }}
                                        className="px-3 py-2 bg-gray-800 text-white rounded-r-lg hover:bg-gray-700 text-sm font-bold"
                                        aria-label="Увеличить размер шрифта"
                                    >
                                        A+
                                    </button>
                                </div>
                            </div>
                            
                            {/* Keyboard Hints */}
                            <div className="text-xs text-gray-400 hidden md:block">
                                ⌨️ Клавиши: ← → (навигация) | Esc (закрыть) | Ctrl+H (контраст)
                            </div>
                        </div>
                    </nav>
                    
                    {/* ========== QUANTUM BACKGROUND ========== */}
                    <div className="absolute inset-0 opacity-30" aria-hidden="true">
                        {!reducedMotion && [...Array(30)].map((_, i) => (
                            <div
                                key={i}
                                className={`absolute w-1 h-1 rounded-full ${
                                    quantumState === 'superposition' ? 'animate-ping' :
                                    quantumState === 'entangled' ? 'animate-pulse' :
                                    'animate-bounce'
                                }`}
                                style={{
                                    left: `${Math.random() * 100}%`,
                                    top: `${Math.random() * 100}%`,
                                    backgroundColor: chromosomes[i % 7].color,
                                    animationDelay: `${Math.random() * 3}s`
                                }}
                            />
                        ))}
                    </div>
                    
                    {/* ========== HEADER ========== */}
                    <header className="text-center pt-24 pb-8 z-10 relative" role="banner">
                        <h1 className="text-4xl md:text-6xl font-bold bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 bg-clip-text text-transparent mb-2">
                            ∅ TERRA
                        </h1>
                        <p className="text-lg md:text-xl text-gray-300 mb-1">
                            Living Organism Portal v7.1
                        </p>
                        <p className="text-sm text-gray-400">
                            {currentEvolutionPhase.name} • {quantumState}
                        </p>
                        <p className="text-xs text-gray-500 mt-2">
                            NULLO → PLT → UCOM → FMP → EUO
                        </p>
                    </header>
                    
                    {/* ========== MAIN CONTENT ========== */}
                    <main 
                        id="main-content"
                        className="flex justify-center items-center min-h-[500px] relative px-4"
                        role="main"
                    >
                        {/* ========== CENTRAL DNA ORGANISM ========== */}
                        <div 
                            className="relative"
                            style={{
                                transform: `scale(${breathScale})`,
                                transition: reducedMotion ? 'none' : 'transform 0.5s ease-out'
                            }}
                            role="region"
                            aria-label="Центральный ДНК организм TERRA"
                        >
                            <div className="relative w-80 md:w-96 h-80 md:h-96">
                                {/* Core */}
                                <button
                                    className="absolute top-1/2 left-1/2 w-20 h-20 md:w-24 md:h-24 rounded-full flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2 transition-all duration-1000 cursor-pointer"
                                    style={{
                                        background: `radial-gradient(circle, ${currentEvolutionPhase.color}, ${currentEvolutionPhase.color}88, transparent)`,
                                        boxShadow: `0 0 60px ${currentEvolutionPhase.color}`,
                                        border: `3px solid ${currentEvolutionPhase.color}`,
                                        transform: reducedMotion 
                                            ? 'translate(-50%, -50%)'
                                            : `translate(-50%, -50%) rotate(${dnaRotation}deg)`
                                    }}
                                    onClick={() => {
                                        const states = ['coherent', 'superposition', 'entangled'];
                                        const currentIndex = states.indexOf(quantumState);
                                        const nextState = states[(currentIndex + 1) % states.length];
                                        setQuantumState(nextState);
                                        announce(`Квантовое состояние изменено на ${nextState}`);
                                    }}
                                    aria-label={`Центральное ядро в состоянии ${currentEvolutionPhase.name}. Нажмите для смены квантового состояния.`}
                                >
                                    <span className="text-3xl md:text-4xl" aria-hidden="true">
                                        {currentEvolutionPhase.symbol}
                                    </span>
                                </button>
                                
                                {/* 7 CHROMOSOMES */}
                                {chromosomes.map((chromosome, index) => {
                                    const radius = 100 + index * 30;
                                    const angle = (360 / chromosomes.length) * index;
                                    
                                    return (
                                        <div
                                            key={chromosome.id}
                                            className="absolute top-1/2 left-1/2 rounded-full"
                                            style={{
                                                width: `${radius * 2}px`,
                                                height: `${radius * 2}px`,
                                                transform: 'translate(-50%, -50%)',
                                                border: `1px solid ${chromosome.color}40`,
                                                animation: reducedMotion 
                                                    ? 'none'
                                                    : `spin ${15 + index * 3}s linear infinite ${index % 2 === 0 ? '' : 'reverse'}`
                                            }}
                                            aria-hidden="true"
                                        >
                                            <button
                                                className={`absolute w-12 h-12 rounded-full flex flex-col items-center justify-center cursor-pointer transition-all duration-300 ${
                                                    activeChromosome === chromosome.id ? 'scale-150' : 'scale-100'
                                                }`}
                                                style={{
                                                    top: '50%',
                                                    left: '50%',
                                                    transform: `translate(-50%, -50%) rotate(${angle}deg) translateY(-${radius}px) rotate(-${angle}deg)`,
                                                    backgroundColor: chromosome.color,
                                                    boxShadow: `0 0 20px ${chromosome.color}`,
                                                    opacity: activeChromosome === chromosome.id ? 1 : 0.8
                                                }}
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    const newActive = activeChromosome === chromosome.id ? null : chromosome.id;
                                                    setActiveChromosome(newActive);
                                                    announce(newActive 
                                                        ? `Открыта хромосома ${chromosome.id}: ${chromosome.name}`
                                                        : 'Хромосома закрыта'
                                                    );
                                                }}
                                                aria-label={`Хромосома ${chromosome.id}: ${chromosome.name}. ${chromosome.docs} документов. Активность ${chromosome.activity}%.`}
                                                aria-pressed={activeChromosome === chromosome.id}
                                            >
                                                <span className="text-xl md:text-2xl" aria-hidden="true">
                                                    {chromosome.symbol}
                                                </span>
                                                <span className="text-[8px] font-bold" aria-hidden="true">
                                                    {chromosome.id}
                                                </span>
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                        
                        {/* ========== 3 ENGINES (only if enabled) ========== */}
                        {showEngines && engines.map((engine, index) => {
                            const bigRadius = 350;
                            const angle = (360 / engines.length) * index + (reducedMotion ? 0 : dnaRotation * 0.5);
                            const x = Math.cos(angle * Math.PI / 180) * bigRadius;
                            const y = Math.sin(angle * Math.PI / 180) * bigRadius;
                            
                            return (
                                <button
                                    key={engine.id}
                                    className={`absolute transition-all duration-500 ${
                                        activeEngine === engine.id ? 'scale-125 z-50' : 'scale-100'
                                    } hidden md:block`}
                                    style={{
                                        left: `calc(50% + ${x}px)`,
                                        top: `calc(50% + ${y}px)`,
                                        transform: 'translate(-50%, -50%)'
                                    }}
                                    onClick={() => {
                                        const newActive = activeEngine === engine.id ? null : engine.id;
                                        setActiveEngine(newActive);
                                        announce(newActive 
                                            ? `Открыт движок ${engine.fullName}`
                                            : 'Движок закрыт'
                                        );
                                    }}
                                    aria-label={`${engine.fullName}: ${engine.description}`}
                                    aria-pressed={activeEngine === engine.id}
                                >
                                    <div 
                                        className="w-28 h-28 rounded-2xl flex flex-col items-center justify-center backdrop-blur-md border-2 shadow-2xl"
                                        style={{
                                            backgroundColor: `${engine.color}20`,
                                            borderColor: engine.color,
                                            boxShadow: activeEngine === engine.id 
                                                ? `0 0 40px ${engine.color}`
                                                : `0 0 15px ${engine.color}80`
                                        }}
                                    >
                                        <div className="text-3xl mb-2" aria-hidden="true">
                                            {engine.symbol}
                                        </div>
                                        <div className="text-xs font-bold text-white text-center px-2">
                                            {engine.name}
                                        </div>
                                    </div>
                                </button>
                            );
                        })}
                    </main>
                    
                    {/* ========== ACTIVE CHROMOSOME PANEL ========== */}
                    {activeChromosome && (
                        <aside 
                            className="fixed bottom-20 left-1/2 transform -translate-x-1/2 w-full max-w-2xl px-4 z-50"
                            role="complementary"
                            aria-label="Информация о хромосоме"
                        >
                            <div 
                                className="backdrop-blur-xl rounded-2xl p-6 border-2 shadow-2xl"
                                style={{
                                    backgroundColor: 'rgba(0, 0, 0, 0.9)',
                                    borderColor: chromosomes.find(c => c.id === activeChromosome).color
                                }}
                            >
                                <div className="flex items-center justify-between mb-4">
                                    <div className="flex items-center gap-3">
                                        <span className="text-4xl" aria-hidden="true">
                                            {chromosomes.find(c => c.id === activeChromosome).symbol}
                                        </span>
                                        <div>
                                            <h2 className="text-xl font-bold text-white">
                                                Хромосома {activeChromosome}: {chromosomes.find(c => c.id === activeChromosome).name}
                                            </h2>
                                            <p className="text-sm text-gray-400">
                                                {chromosomes.find(c => c.id === activeChromosome).docs} документов
                                            </p>
                                        </div>
                                    </div>
                                    <button
                                        onClick={() => {
                                            setActiveChromosome(null);
                                            announce('Панель хромосомы закрыта');
                                        }}
                                        className="text-3xl text-gray-400 hover:text-white min-w-[44px] min-h-[44px]"
                                        aria-label="Закрыть панель хромосомы"
                                    >
                                        ×
                                    </button>
                                </div>
                                <p className="text-gray-300 mb-3">
                                    {chromosomes.find(c => c.id === activeChromosome).description}
                                </p>
                                <div className="flex items-center gap-2">
                                    <span className="text-sm text-gray-400">Активность:</span>
                                    <div 
                                        className="flex-1 h-3 bg-gray-700 rounded-full overflow-hidden"
                                        role="progressbar"
                                        aria-valuenow={chromosomes.find(c => c.id === activeChromosome).activity}
                                        aria-valuemin="0"
                                        aria-valuemax="100"
                                        aria-label="Уровень активности хромосомы"
                                    >
                                        <div 
                                            className="h-full bg-gradient-to-r from-cyan-500 to-purple-500 transition-all duration-1000"
                                            style={{
                                                width: `${chromosomes.find(c => c.id === activeChromosome).activity}%`
                                            }}
                                        />
                                    </div>
                                    <span className="text-sm font-bold text-white">
                                        {chromosomes.find(c => c.id === activeChromosome).activity}%
                                    </span>
                                </div>
                            </div>
                        </aside>
                    )}
                    
                    {/* ========== ACTIVE ENGINE PANEL ========== */}
                    {activeEngine && (
                        <aside 
                            className="fixed top-24 right-4 w-80 md:w-96 z-50"
                            role="complementary"
                            aria-label="Информация о движке"
                        >
                            <div 
                                className="backdrop-blur-xl rounded-2xl p-6 border-2 shadow-2xl"
                                style={{
                                    backgroundColor: 'rgba(0, 0, 0, 0.9)',
                                    borderColor: engines.find(e => e.id === activeEngine).color
                                }}
                            >
                                <div className="flex items-center justify-between mb-4">
                                    <div className="flex items-center gap-3">
                                        <span className="text-4xl" aria-hidden="true">
                                            {engines.find(e => e.id === activeEngine).symbol}
                                        </span>
                                        <div>
                                            <h2 className="text-xl font-bold text-white">
                                                {engines.find(e => e.id === activeEngine).fullName}
                                            </h2>
                                        </div>
                                    </div>
                                    <button
                                        onClick={() => {
                                            setActiveEngine(null);
                                            announce('Панель движка закрыта');
                                        }}
                                        className="text-3xl text-gray-400 hover:text-white min-w-[44px] min-h-[44px]"
                                        aria-label="Закрыть панель движка"
                                    >
                                        ×
                                    </button>
                                </div>
                                <p className="text-sm text-gray-300">
                                    {engines.find(e => e.id === activeEngine).description}
                                </p>
                            </div>
                        </aside>
                    )}
                    
                    {/* ========== INPUT AREA ========== */}
                    <div className="fixed bottom-4 left-4 right-4 max-w-xl mx-auto z-40">
                        <div className="backdrop-blur-xl bg-black/80 rounded-2xl p-4 border border-cyan-500/30">
                            <label htmlFor="terra-input" className="sr-only">
                                Введите запрос для обработки через систему TERRA
                            </label>
                            <div className="flex gap-2">
                                <input
                                    id="terra-input"
                                    type="text"
                                    value={userInput}
                                    onChange={(e) => setUserInput(e.target.value)}
                                    onKeyPress={(e) => {
                                        if (e.key === 'Enter') {
                                            processInput(userInput);
                                        }
                                    }}
                                    placeholder="Введите запрос..."
                                    className="flex-1 bg-gray-900/50 text-white px-4 py-3 rounded-xl border border-gray-700 focus:outline-none focus:border-cyan-500"
                                    aria-describedby="input-hint"
                                />
                                <button
                                    onClick={() => processInput(userInput)}
                                    className="px-6 py-3 bg-gradient-to-r from-cyan-500 to-purple-500 text-white font-bold rounded-xl hover:shadow-lg transition-all"
                                    aria-label="Обработать запрос через систему TERRA"
                                >
                                    Обработать
                                </button>
                            </div>
                            <p id="input-hint" className="keyboard-hint mt-2">
                                Нажмите Enter для отправки. Обработка через NULLO → PLT → UCOM → FMP → EUO
                            </p>
                            
                            {/* Processing Indicator */}
                            {processingStage && (
                                <div 
                                    className="mt-3 flex items-center gap-2"
                                    role="progressbar"
                                    aria-label="Прогресс обработки"
                                >
                                    {['nullo', 'plt', 'ucom', 'fmp', 'euo'].map((stage) => (
                                        <div
                                            key={stage}
                                            className={`flex-1 h-2 rounded-full transition-all duration-300`}
                                            style={{
                                                backgroundColor: processingStage === stage ? '#00CED1' : '#00CED140'
                                            }}
                                            aria-label={processingStage === stage ? `Обработка стадии ${stage}` : ''}
                                        />
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                    
                    {/* ========== FOOTER ========== */}
                    <footer className="fixed bottom-4 right-4 text-right text-xs text-gray-500 z-20">
                        <div className="font-bold text-gray-400">∅ TERRA v7.1 Accessible</div>
                        <div>Abdurashid Abdukarimov</div>
                        <div>ORCID: 0009-0000-6394-4912</div>
                        <div className="mt-1 text-[10px]">
                            ♿ WCAG 2.1 Level AA
                        </div>
                        <div className="text-[10px]">
                            L0 Principle: Для ВСЕХ детей ✅
                        </div>
                    </footer>
                </div>
            );
        };
        
        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TerraAccessiblePortal />);
    </script>
    
</body>
</html>
