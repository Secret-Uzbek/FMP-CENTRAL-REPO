<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Metascience Foundation | TERRA DNA</title>
    <style>
        :root { --primary: #00416A; --secondary: #E4E5E6; --accent: #0088ff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #00416A, #E4E5E6); min-height: 100vh; margin: 0; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { background: rgba(255,255,255,0.9); padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 20px; text-align: center; }
        .did-info { font-family: monospace; color: var(--primary); font-weight: bold; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 200px; border: 1px solid #ccc; border-radius: 10px; padding: 10px; box-sizing: border-box; resize: none; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: var(--accent); }
        .status-bar { margin-top: 10px; font-size: 0.8em; color: #666; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FRACTAL METASCIENCE FOUNDATION</h1>
            <div class="did-info">ORCID: 0009-0000-6394-4912 | TERRA DNA CORE</div>
            <p><strong>Deterministic Intelligence as a Sovereign Asset</strong></p>
        </div>

        <div class="main-grid">
            <div class="card">
                <h3>Парсер Тезауруса (Terra Engine)</h3>
                <textarea id="input" placeholder="Введите данные для обработки..."></textarea>
                <div style="margin-top: 10px;">
                    <button class="btn" onclick="process()">ОБРАБОТАТЬ</button>
                    <button class="btn" style="background:#555" onclick="clearAll()">ОЧИСТИТЬ</button>
                </div>
            </div>
            <div class="card">
                <h3>AI Анализ / Результат</h3>
                <div id="output" style="background:#f9f9f9; height:200px; padding:10px; border-radius:10px; overflow-y:auto; border:1px solid #ddd;">
                    Ожидание входных данных...
                </div>
                <div class="status-bar">
                    System Status: <span style="color:green">● ACTIVE</span> | Mode: Deterministic
                </div>
            </div>
        </div>
    </div>

    <script>
        function process() {
            const input = document.getElementById('input').value;
            const output = document.getElementById('output');
            if(!input) return;
            output.innerHTML = "<strong>Обработка через Terra DNA...</strong><br>Синхронизация с тезаурусом завершена.<br>Объект детерминирован.";
        }
        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').innerHTML = 'Ожидание входных данных...';
        }
    </script>
</body>
</html>
