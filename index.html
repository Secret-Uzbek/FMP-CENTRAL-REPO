<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Terra Codex | Living System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        /* --- TERRA ECOSYSTEM STYLES v3.1 --- */
        :root {
            --terra-green: #2E8B57;
            --terra-blue: #4A90E2;
            --terra-purple: #7B66DC;
            --terra-orange: #FF8C42;
            --bg-deep: #050810;
            --glass: rgba(20, 30, 40, 0.7);
            --border: rgba(74, 144, 226, 0.2);
        }

        body {
            margin: 0;
            background: radial-gradient(circle at center, #1a253a 0%, #050810 100%);
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow-x: hidden;
            height: 100vh;
        }

        /* ЖИВОЙ ФОН (Three.js Canvas) */
        #neural-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
        }

        #app {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 98vh;
        }

        /* --- UI COMPONENTS --- */
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 25px;
        }
        .logo { font-size: 24px; font-weight: 300; letter-spacing: 2px; display: flex; align-items: center; gap: 15px; }
        .logo strong { font-weight: 800; color: white; }
        .logo-icon { 
            width: 40px; height: 40px; 
            background: linear-gradient(45deg, var(--terra-green), var(--terra-blue));
            border-radius: 8px;
            display: grid; place-items: center; font-weight: bold; font-size: 24px; color: #000;
        }

        /* GRID */
        .grid-layout {
            display: grid;
            grid-template-columns: 320px 1fr 320px; /* Три колонки: История | Визуал | Агент */
            gap: 20px;
            flex-grow: 1;
            overflow: hidden;
        }

        /* COLUMNS */
        .col-title {
            color: var(--terra-blue);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        /* HISTORY FEED */
        .history-feed { overflow-y: auto; padding-right: 5px; }
        .history-item {
            border-left: 2px solid var(--terra-purple);
            padding-left: 15px;
            margin-bottom: 25px;
            position: relative;
        }
        .history-item::before {
            content: ''; position: absolute; left: -6px; top: 0;
            width: 10px; height: 10px; background: var(--terra-purple); border-radius: 50%;
        }
        .year { font-weight: bold; color: var(--terra-orange); font-size: 14px; }
        .event { font-weight: 600; margin: 4px 0; }
        .desc { font-size: 13px; color: #aaa; line-height: 1.4; }

        /* CENTER VISUAL (No Images, CSS Art) */
        .visual-center {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .data-card {
            flex-grow: 1;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* CSS ГЕНЕРАТИВНАЯ ГРАФИКА (Вместо картинок) */
        .fractal-circle {
            width: 200px; height: 200px;
            border-radius: 50%;
            border: 2px solid var(--terra-green);
            position: relative;
            animation: pulse 4s infinite;
        }
        .fractal-circle::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 150px; height: 150px;
            border: 2px solid var(--terra-blue);
            border-radius: 50%;
            animation: spin 10s linear infinite;
        }
        .fractal-circle::before {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100px; height: 100px;
            border: 1px dashed var(--terra-orange);
            border-radius: 50%;
            animation: spin-rev 15s linear infinite;
        }

        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes spin-rev { 100% { transform: translate(-50%, -50%) rotate(-360deg); } }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 20px rgba(46, 139, 87, 0.2); } 50% { box-shadow: 0 0 50px rgba(46, 139, 87, 0.5); } }

        /* AGENT SHIRAK */
        .agent-feed {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg { padding: 10px; border-radius: 8px; line-height: 1.4; }
        .msg.bot { background: rgba(46, 139, 87, 0.1); border-left: 3px solid var(--terra-green); }
        .msg.user { background: rgba(74, 144, 226, 0.1); border-right: 3px solid var(--terra-blue); text-align: right; }
        
        .input-box {
            display: flex; gap: 10px; margin-top: 15px;
        }
        input {
            width: 100%; background: #111; border: 1px solid #333; color: white;
            padding: 10px; border-radius: 6px;
        }
        button {
            background: var(--terra-green); border: none; color: white;
            padding: 0 15px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        @media (max-width: 900px) {
            .grid-layout { grid-template-columns: 1fr; grid-template-rows: auto auto 400px; }
        }
    </style>
</head>
<body>
    <canvas id="neural-canvas"></canvas>

    <div id="app">
        <header class="glass-panel" style="flex-direction: row;">
            <div class="logo">
                <div class="logo-icon">۞</div>
                <div>Terra <strong>Codex</strong> <span style="font-size: 12px; opacity: 0.7;">v3.0</span></div>
            </div>
            <div style="font-size: 12px; font-family: monospace;">
                SYSTEM: <span style="color: var(--terra-green);">ONLINE</span><br>
                NODE: TASHKENT-01
            </div>
        </header>

        <div class="grid-layout">
            
            <div class="glass-panel">
                <div class="col-title">⏳ CHRONOS LINE</div>
                <div class="history-feed" id="history-feed">
                    </div>
            </div>

            <div class="visual-center">
                <div class="glass-panel data-card">
                    <div class="fractal-circle"></div>
                    <div style="position: absolute; bottom: 20px; text-align: center; width: 100%;">
                        <div style="font-weight: bold; color: var(--terra-green);">FRACTAL CORE ACTIVE</div>
                        <div style="font-size: 10px; opacity: 0.7;">Processing Semantic Weights...</div>
                    </div>
                </div>
                <div class="glass-panel" style="height: 150px; justify-content: center; align-items: center; text-align: center;">
                    <div style="font-size: 12px; color: var(--terra-blue); margin-bottom: 10px;">NEURAL SILK ROAD STATUS</div>
                    <div style="display: flex; gap: 5px; align-items: flex-end; height: 50px;">
                        <div style="width: 10px; height: 30%; background: var(--terra-purple); animation: h 1s infinite;"></div>
                        <div style="width: 10px; height: 70%; background: var(--terra-purple); animation: h 1.2s infinite;"></div>
                        <div style="width: 10px; height: 50%; background: var(--terra-purple); animation: h 0.8s infinite;"></div>
                        <div style="width: 10px; height: 90%; background: var(--terra-purple); animation: h 1.5s infinite;"></div>
                        <div style="width: 10px; height: 40%; background: var(--terra-purple); animation: h 1.1s infinite;"></div>
                    </div>
                    <style>@keyframes h { 50% { height: 100%; } }</style>
                </div>
            </div>

            <div class="glass-panel">
                <div class="col-title">👁️ AGENT SHIRAK</div>
                <div class="agent-feed" id="chat-window">
                    <div class="msg bot">System Initialized.<br>Protocol: NULLO<br>Paradigm: FRACTAL</div>
                    <div class="msg bot">Salom, Arxitektor. Men tayyorman. (Ready)</div>
                </div>
                <div class="input-box">
                    <input type="text" id="user-input" placeholder="Command..." onkeypress="handleKey(event)">
                    <button onclick="send()">></button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- 1. DATA CORE (REAL DATA FROM YOUR FILES) ---
        const EVENTS = [
            { year: "1441", date: "Feb 09", title: "Navoi's Birth (Herat)", desc: "The linguistic singularity. Origin of the Corpus." },
            { year: "1483", date: "Feb 14", title: "Babur's Birth (Andijan)", desc: "Fractal recursion begins. The geopolitical node." },
            { year: "1966", date: "Jan 10", title: "Tashkent Declaration", desc: "India-Pakistan peace brokered in Uzbekistan." },
            { year: "2025", date: "May", title: "Prison Coding", desc: "The Architect drafts the NULLO Protocol in isolation." },
            { year: "2026", date: "Feb 14", title: "FMP v3.0 Launch", desc: "System goes live. UST Alpha deployment." }
        ];

        // --- 2. RENDER HISTORY ---
        const historyContainer = document.getElementById('history-feed');
        EVENTS.forEach(ev => {
            historyContainer.innerHTML += `
                <div class="history-item">
                    <div class="year">${ev.year} · ${ev.date}</div>
                    <div class="event">${ev.title}</div>
                    <div class="desc">${ev.desc}</div>
                </div>
            `;
        });

        // --- 3. AGENT LOGIC (SHIRAK) ---
        const chat = document.getElementById('chat-window');
        function handleKey(e) { if(e.key === 'Enter') send(); }
        
        function send() {
            const input = document.getElementById('user-input');
            const txt = input.value;
            if(!txt) return;

            // User Message
            chat.innerHTML += `<div class="msg user">${txt}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            // AI Response Simulation
            setTimeout(() => {
                let resp = "Analyzing semantic structure...";
                const t = txt.toLowerCase();
                
                if(t.includes("navoi")) resp = "Navoi provides the **Lexical Foundation**. 26 works integrated.";
                else if(t.includes("babur")) resp = "Babur represents **Fractal Expansion**. From Ferghana to India.";
                else if(t.includes("nullo")) resp = "NULLO Protocol: **Deconstruct to Zero Point**. No interference.";
                else if(t.includes("ust")) resp = "UST (Universal Semantic Translator) is **ONLINE**. Mapping Ontology...";
                else resp = "Input logged to **Living Index**. Processing...";

                chat.innerHTML += `<div class="msg bot">${resp}</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 600);
        }

        // --- 4. LIVING BACKGROUND (THREE.JS) ---
        const canvas = document.getElementById('neural-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({canvas: canvas, alpha: true});
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Particles
        const geometry = new THREE.BufferGeometry();
        const count = 1500;
        const pos = new Float32Array(count * 3);
        for(let i=0; i<count*3; i++) {
            pos[i] = (Math.random() - 0.5) * 15;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const material = new THREE.PointsMaterial({size: 0.03, color: 0x4A90E2});
        const stars = new THREE.Points(geometry, material);
        scene.add(stars);

        // Connections (Lines)
        const lineMat = new THREE.LineBasicMaterial({color: 0x2E8B57, transparent: true, opacity: 0.3});
        const lineGeo = new THREE.BufferGeometry();
        // Create a few static connections for visual effect
        const linePos = [];
        for(let i=0; i<100; i++) {
            linePos.push(0,0,0);
            linePos.push((Math.random()-0.5)*5, (Math.random()-0.5)*5, (Math.random()-0.5)*5);
        }
        lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePos, 3));
        const lines = new THREE.LineSegments(lineGeo, lineMat);
        scene.add(lines);

        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            stars.rotation.y += 0.001;
            lines.rotation.y -= 0.001;
            renderer.render(scene, camera);
        }
        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
